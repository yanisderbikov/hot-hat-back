name: GPT-Live Worker Checks

on:
  push:
    branches: [new-dev]
    paths:
      - 'agents/gpt-live/**'
      - '.github/workflows/gpt-live-checks.yml'
  workflow_dispatch:

concurrency:
  group: voice-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  voice-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agents/gpt-live/requirements.txt
      - name: Install GPT-Live dependencies
        run: python -m pip install -r agents/gpt-live/requirements.txt
      - name: Compile and run all voice regression tests
        working-directory: agents/gpt-live
        run: |
          python -m compileall -q .
          python -m unittest -v test_config test_duet_liveness test_card_prompts
          python -c "import agent; import game_client; print('GPT-Live smoke OK')"
