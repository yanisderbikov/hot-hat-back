name: GPU worker (CPU-safe contract checks)
on:
  push:
    branches: [new-dev]
    paths:
      - "gpu-worker/**"
      - ".github/workflows/gpu-worker-checks.yml"
  workflow_dispatch:
jobs:
  gpu-worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install "numpy==1.26.4" "opencv-python-headless==4.10.0.84" pytest
      - name: Syntax and contract tests (models intentionally mocked)
        working-directory: gpu-worker
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile app/matting.py app/download_models.py app/main.py app/inspect_alpha.py\n          bash -n smoke_person_video.sh
          python -m pytest -q tests/test_matting_pipeline.py tests/test_video_mux.py
