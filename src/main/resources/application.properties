server.port=8092
spring.application.name=hot-hat-back

# Фронт раздаётся отдельно и стучится сюда кросс-доменно.
allowed.origins=${ALLOWED_ORIGINS}
url.back=${URL_BACK:http://localhost:8092}
url.front=${HOT_HAT_PUBLIC_URL:http://localhost:5000}

# PostgreSQL
spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.servlet.multipart.max-file-size=16MB
spring.servlet.multipart.max-request-size=16MB
# Аватары и логотипы команд приезжают data-URL'ами до 280 КБ, мемы — до 8 МБ.
server.tomcat.max-http-form-post-size=16MB

# --- Личность: свои JWT. Секрет обязателен, дефолта нет намеренно ---
# Access живёт 15 минут: этого хватает, чтобы не дёргать refresh на каждый ход,
# и мало, чтобы утёкший токен не жил долго. Refresh — 30 дней, с ротацией.
jwt.secret=${JWT_SECRET}
jwt.access.ttl.seconds=${JWT_ACCESS_TTL_SECONDS:900}
jwt.refresh.ttl.seconds=${JWT_REFRESH_TTL_SECONDS:2592000}

# --- Права ---
hot-hat.owner-email=${HOT_HAT_OWNER_EMAIL:owner-not-configured}
hot-hat.admin-emails=${ADMIN_EMAILS:}
hot-hat.admin-uids=${ADMIN_UIDS:}
hot-hat.public-url=${HOT_HAT_PUBLIC_URL:http://localhost:5000}
hot-hat.api-public-url=${HOT_HAT_API_PUBLIC_URL:http://localhost:8092}
hot-hat.cron-secret=${CRON_SECRET:}

# --- LiveKit ---
livekit.url=${LIVEKIT_URL:}
livekit.api-key=${LIVEKIT_API_KEY:}
livekit.api-secret=${LIVEKIT_API_SECRET:}

# --- TURN (coturn, HMAC-SHA1 short-term credentials) ---
turn.urls=${TURN_URLS:${TURN_URL:}}
turn.secret=${TURN_SECRET:}
turn.ttl-seconds=${TURN_TTL_SECONDS:7200}

# --- S3-совместимое хранилище (записи игр + мем-видео) ---
s3.endpoint=${HOT_HAT_S3_ENDPOINT:}
s3.region=${HOT_HAT_S3_REGION:us-east-1}
s3.bucket=${HOT_HAT_S3_BUCKET:}
s3.access-key=${HOT_HAT_S3_ACCESS_KEY:}
s3.secret-key=${HOT_HAT_S3_SECRET_KEY:}
s3.force-path-style=${HOT_HAT_S3_FORCE_PATH_STYLE:true}

# --- Метрики машины: бекенд читает /proc сам, отдельного сервиса на VPS нет ---
monitor.secret=${HOT_HAT_MONITOR_SECRET:}
monitor.host.disk-root=${HOT_HAT_DISK_ROOT:/}
# Пусто по умолчанию: мем-видео лежат в S3, локальный каталог считать не нужно
monitor.host.media-root=${HOT_HAT_MEDIA_ROOT:}
monitor.vps-monthly-traffic-limit-gb=${HOT_HAT_VPS_MONTHLY_TRAFFIC_LIMIT_GB:0}

# --- Отчёты о расходе ресурсов ---
report.resend-api-key=${RESEND_API_KEY:}
report.email=${REPORT_EMAIL:}
report.from=${REPORT_FROM:HOT-HAT Monitor <onboarding@resend.dev>}
report.hour=${REPORT_HOUR:23}
report.timezone=${REPORT_TIMEZONE:Asia/Yekaterinburg}

# --- Крон вместо vercel.json crons ---
cleanup.rooms.cron=${CLEANUP_ROOMS_CRON:0 20 2 * * *}
cleanup.recordings.cron=${CLEANUP_RECORDINGS_CRON:0 40 2 * * *}
monitor.collect.cron=${MONITOR_COLLECT_CRON:0 0 5,11,17,23 * * *}

management.endpoints.web.base-path=/api/actuator
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# --- Спецификация API ---
# OpenAPI 3.1: только в нём описание переживает соседство с $ref. В 3.0
# @Schema(description=…) на поле-ссылке молча пропадал — шестнадцать схем
# теряли подписи вложенных объектов.
springdoc.api-docs.version=openapi_3_1
# Уборка «сломанных ссылок» включена в springdoc по умолчанию и портит ровно
# то, ради чего взят 3.1. Она обходит схемы поверхностно: ссылку внутри
# properties видит, а внутри items — нет. Итог был двойной: двадцать пять
# схем, на которые ссылались только элементы списков (DivisionView, WeaponView,
# TeamMemberView и прочие), удалялись из components, оставляя ссылку в никуда;
# а у полей-ссылок та же уборка срезала соседей — LobbyPlayerView.arsenal
# терял description по правилу 3.0, которого в 3.1 нет. Выключено — и то и
# другое на месте.
springdoc.remove-broken-reference-definitions=false
# Операции в порядке объявления, а не по алфавиту: пары «создать/удалить»
# должны стоять рядом.
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
