# Настройки сквозных тестов. Профиль e2e включается только классами
# ru.hothat.e2e.*, поэтому на быстрые модульные тесты он не влияет.
#
# База — тот же docker-Postgres, что у приложения (порт 5462), но своя:
# миграции называют схему v2 явно, отдельной схемой не обойтись, а отдельная
# база стоит одного CREATE DATABASE и не даёт тесту трогать данные разработки.
# Адрес всё равно подставляется в @DynamicPropertySource: базу нужно завести
# до того, как поднимется пул соединений.
spring.datasource.url=jdbc:postgresql://localhost:5462/hot_hat_e2e
spring.datasource.username=hothat
spring.datasource.password=hothat

allowed.origins=http://localhost:5000

# Не короче 32 байт: с более коротким ключом HMAC-SHA256 приложение не стартует.
jwt.secret=e2e-only-secret-e2e-only-secret-0123456789
jwt.access.ttl.seconds=900
jwt.refresh.ttl.seconds=2592000

hot-hat.owner-email=owner@hot-hat.test
hot-hat.admin-emails=
hot-hat.admin-uids=
hot-hat.cron-secret=e2e-cron-secret
monitor.secret=e2e-monitor-secret

# Уборщики и сбор метрик по расписанию тесту не нужны: "-" выключает @Scheduled.
cleanup.rooms.cron=-
cleanup.recordings.cron=-
monitor.collect.cron=-

# Тесты сами говорят, что сломалось; лишний SQL в выводе только мешает.
logging.level.org.hibernate.SQL=warn
logging.level.org.springframework.web=warn
